
name: Build Apocrypha Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          set -eu
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "ZIP não encontrado"; exit 1; }
          unzip -oq "$ZIP" -d source
          SETTINGS=$(find source -type f -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS" || { echo "Projeto Android não encontrado no ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ApocryphaLauncher-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
