
name: Build Apocrypha Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado na raiz."
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          WRAPPER=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Não encontrei gradlew no ZIP."
            find source -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          find source -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -print -quit)"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ApocryphaLauncher-debug-apk
          path: output/*.apk
          if-no-files-found: error
